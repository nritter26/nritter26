<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">MALLARD — Synthwave Systems</title>
  <desc id="desc">A highly animated synthwave scene with a left-facing pixel spaceship towing a neon developer billboard, flying from right to left through stars, scanlines, mountains, circuitry and a perspective grid.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050014"/><stop offset=".48" stop-color="#18002e"/><stop offset="1" stop-color="#03000b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe978"/><stop offset=".48" stop-color="#ff6bd6"/><stop offset="1" stop-color="#ff168e"/>
    </linearGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".5" stop-color="#b9d8ff"/><stop offset="1" stop-color="#6e5cff"/>
    </linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#190d36"/><stop offset=".5" stop-color="#090714"/><stop offset="1" stop-color="#25063a"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#32125e"/><stop offset="1" stop-color="#080014"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <pattern id="scan" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="2" fill="#fff" opacity=".035"/>
    </pattern>

    <clipPath id="sunClip"><circle cx="700" cy="190" r="108"/></clipPath>
  </defs>

  <!-- DEEP SPACE -->
  <rect width="1400" height="560" fill="url(#bg)"/>

  <!-- Moving star field -->
  <g fill="#fff">
    <g opacity=".9">
      <circle cx="90" cy="70" r="1.6"/><circle cx="190" cy="135" r="1"/>
      <circle cx="315" cy="48" r="1.4"/><circle cx="455" cy="105" r="1"/>
      <circle cx="820" cy="62" r="1.5"/><circle cx="1010" cy="120" r="1"/>
      <circle cx="1150" cy="55" r="1.7"/><circle cx="1320" cy="145" r="1.1"/>
    </g>
    <g opacity=".6">
      <circle cx="50" cy="180" r="1"/><circle cx="260" cy="190" r="1.2"/>
      <circle cx="520" cy="170" r="1"/><circle cx="910" cy="185" r="1.2"/>
      <circle cx="1090" cy="205" r="1"/><circle cx="1280" cy="185" r="1.3"/>
    </g>
  </g>

  <!-- twinkling stars -->
  <g fill="#00f6ff" filter="url(#glow)">
    <circle cx="145" cy="95" r="2"><animate attributeName="opacity" values=".15;1;.15" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="155" r="2"><animate attributeName="opacity" values="1;.15;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="110" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1240" cy="80" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Retro sun / moon -->
  <circle cx="700" cy="190" r="145" fill="#ff35c8" opacity=".12" filter="url(#bigGlow)"/>
  <circle cx="700" cy="190" r="122" fill="none" stroke="#ff8de5" stroke-width="2" opacity=".28"/>

  <circle cx="700" cy="190" r="130" fill="#ff22bf" opacity=".18" filter="url(#bigGlow)"/>
  <circle cx="700" cy="190" r="108" fill="url(#sun)" stroke="#ffb4ef" stroke-width="3"/>
  <g clip-path="url(#sunClip)" stroke="#7e176d" stroke-width="8" opacity=".65">
    <path d="M580 135H820"/><path d="M580 157H820"/><path d="M580 180H820"/>
    <path d="M580 203H820"/><path d="M580 226H820"/><path d="M580 249H820"/>
  </g>

  <!-- distant mountains -->
  <path d="M0 310 L150 240 250 295 390 210 510 295 635 225 760 300 900 215 1030 295 1160 230 1280 295 1400 235 V350 H0Z"
        fill="url(#mountain)" stroke="#8d2cff" stroke-width="2"/>
  <path d="M0 328 L160 275 250 318 390 245 510 320 635 260 760 325 900 250 1030 320 1160 265 1280 320 1400 270"
        fill="none" stroke="#ff26c8" stroke-width="2" opacity=".7"/>

  <!-- horizon glow -->
  <rect y="328" width="1400" height="4" fill="#00f6ff" filter="url(#glow)"/>
  <rect y="320" width="1400" height="22" fill="#00eaff" opacity=".08"/>


  <!-- CYAN HORIZON + WATER REFLECTION -->
  <g>
    <!-- soft horizon glow -->
    <rect x="0" y="327" width="1400" height="5" fill="#00f6ff" opacity=".8" filter="url(#glow)"/>
    <rect x="0" y="333" width="1400" height="80" fill="#00d9ff" opacity=".035"/>

    <!-- skyline silhouettes -->
    <g fill="#080817" stroke="#00eaff" stroke-width="1.5" opacity=".96">
      <path d="M0 330V292H42V330H57V268H91V330H104V300H135V330H151V250H185V330H198V278H232V330H248V235H286V330H302V282H331V330H346V258H381V330H400V220H443V330Z"/>
      <path d="M430 330V270H462V330H477V245H511V330H527V205H570V330H585V255H616V330H632V230H674V330H690V185H735V330H751V250H783V330H798V215H842V330H858V265H888V330Z"/>
      <path d="M875 330V245H909V330H924V275H954V330H970V230H1010V330H1025V258H1055V330H1070V200H1112V330H1128V245H1164V330H1180V280H1210V330H1225V220H1265V330H1280V260H1315V330H1330V290H1360V330H1400V330Z"/>
    </g>

    <!-- rooftop antennas -->
    <g stroke="#00f6ff" stroke-width="2" fill="none" opacity=".8">
      <path d="M420 220v-18M711 185v-28M1090 200v-22M1245 220v-25"/>
    </g>

    <!-- city windows -->
    <g fill="#00f6ff" opacity=".72">
      <path d="M63 277h7v5h-7zM63 290h7v5h-7zM63 303h7v5h-7z"/>
      <path d="M159 260h7v5h-7zM159 273h7v5h-7zM159 286h7v5h-7zM159 299h7v5h-7z"/>
      <path d="M258 247h7v5h-7zM258 260h7v5h-7zM258 273h7v5h-7zM258 286h7v5h-7z"/>
      <path d="M410 232h8v6h-8zM410 247h8v6h-8zM410 262h8v6h-8z"/>
      <path d="M542 218h8v6h-8zM542 233h8v6h-8zM542 248h8v6h-8zM542 263h8v6h-8z"/>
      <path d="M705 198h8v6h-8zM705 214h8v6h-8zM705 230h8v6h-8zM705 246h8v6h-8z"/>
      <path d="M814 230h8v6h-8zM814 245h8v6h-8zM814 260h8v6h-8z"/>
      <path d="M984 245h8v6h-8zM984 260h8v6h-8zM984 275h8v6h-8z"/>
      <path d="M1087 214h8v6h-8zM1087 229h8v6h-8zM1087 244h8v6h-8zM1087 259h8v6h-8z"/>
      <path d="M1240 237h8v6h-8zM1240 252h8v6h-8zM1240 267h8v6h-8z"/>
    </g>

    <g fill="#ff35cf">
      <rect x="75" y="311" width="8" height="4"><animate attributeName="opacity" values=".1;1;.1" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="275" y="295" width="8" height="4"><animate attributeName="opacity" values="1;.1;1" dur="1.7s" repeatCount="indefinite"/></rect>
      <rect x="555" y="275" width="8" height="4"><animate attributeName="opacity" values=".1;1;.1" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="730" y="265" width="8" height="4"><animate attributeName="opacity" values="1;.1;1" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="1015" y="285" width="8" height="4"><animate attributeName="opacity" values=".1;1;.1" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="1270" y="280" width="8" height="4"><animate attributeName="opacity" values="1;.1;1" dur="1.3s" repeatCount="indefinite"/></rect>
    </g>

    <!-- water below the city -->
    <rect x="0" y="333" width="1400" height="227" fill="#020611"/>

    <!-- soft ambient water glow -->
    <rect x="0" y="333" width="1400" height="150" fill="#00b9ff" opacity=".035"/>

    <!-- MOON/SUN REFLECTION: wide, soft vertical shimmer -->
    <g opacity=".34" filter="url(#bigGlow)">
      <ellipse cx="700" cy="390" rx="145" ry="24" fill="#ff5acb"/>
      <ellipse cx="700" cy="425" rx="105" ry="18" fill="#ff7bd8"/>
      <ellipse cx="700" cy="460" rx="70" ry="12" fill="#00eaff"/>
    </g>
    <g opacity=".5" filter="url(#glow)">
      <path d="M610 350 Q700 365 790 350 Q755 372 790 382 Q700 394 610 382 Q645 372 610 350Z" fill="#ff67d3"/>
      <path d="M635 400 Q700 412 765 400 Q745 418 765 428 Q700 437 635 428 Q655 418 635 400Z" fill="#ff8bdf"/>
      <path d="M655 450 Q700 458 745 450 Q730 465 745 473 Q700 480 655 473 Q670 465 655 450Z" fill="#6ff7ff"/>
    </g>

    <!-- blurred skyline reflections, stretched and broken -->
    <g opacity=".18" filter="url(#bigGlow)">
      <rect x="30" y="345" width="420" height="28" fill="#00eaff"/>
      <rect x="455" y="350" width="430" height="34" fill="#ff32c8"/>
      <rect x="900" y="344" width="460" height="30" fill="#00eaff"/>
      <rect x="100" y="395" width="300" height="18" fill="#00bde8"/>
      <rect x="510" y="405" width="390" height="20" fill="#ff45d1"/>
      <rect x="970" y="392" width="300" height="18" fill="#00cfee"/>
    </g>

    <!-- organic water ripples, not perspective lines -->
    <g fill="none" stroke-linecap="round">
      <g stroke="#00eaff" opacity=".22" stroke-width="3">
        <path d="M70 365 C130 357 180 374 245 365 S365 360 430 369"/>
        <path d="M860 370 C920 360 980 378 1040 367 S1160 361 1290 372"/>
        <path d="M20 425 C90 416 140 432 210 424 S330 418 395 429"/>
        <path d="M470 440 C540 430 600 447 675 438 S805 432 875 444"/>
        <path d="M960 430 C1030 419 1090 439 1160 428 S1280 421 1380 435"/>
      </g>
      <g stroke="#ff59d5" opacity=".2" stroke-width="2">
        <path d="M130 385 C190 378 230 390 285 384"/>
        <path d="M545 388 C600 381 645 395 710 386"/>
        <path d="M1050 386 C1110 378 1160 394 1230 385"/>
        <path d="M230 470 C300 460 355 478 420 469"/>
        <path d="M790 485 C850 474 910 492 980 482"/>
      </g>
    </g>

    <!-- animated shimmer fragments -->
    <g fill="#7cffff" opacity=".35">
      <rect x="580" y="374" width="38" height="3" rx="2"><animate attributeName="x" values="580;650;580" dur="3.2s" repeatCount="indefinite"/></rect>
      <rect x="735" y="410" width="52" height="3" rx="2"><animate attributeName="x" values="735;680;735" dur="2.7s" repeatCount="indefinite"/></rect>
      <rect x="625" y="465" width="30" height="3" rx="2"><animate attributeName="x" values="625;700;625" dur="3.7s" repeatCount="indefinite"/></rect>
    </g>

    <!-- darkening toward the foreground for depth -->
    <rect x="0" y="485" width="1400" height="75" fill="#01030a" opacity=".38"/>
  </g>

  <!-- SHOOTING STAR / METEOR -->
  <g>
    <path d="M1240 82L1090 155" stroke="#00f6ff" stroke-width="4" stroke-linecap="round" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0;1;1;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="d"
        values="M1240 82L1090 155;M1240 82L1090 155;M1240 82L1090 155;M1240 82L1090 155;M1240 82L1090 155"
        dur="7s" repeatCount="indefinite"/>
    </path>
    <circle cx="1240" cy="82" r="5" fill="#fff" filter="url(#glow)" opacity="0">
      <animate attributeName="cx" values="1240;1240;1120;1000" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="82;82;140;198" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <path d="M1240 82L1120 140" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 0;-120 58;-260 125" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- MAIN FORMATION: RIGHT -> LEFT -->
  <g>
    <!-- Correct direction: starts off-screen RIGHT and ends off-screen LEFT -->
    <animateTransform attributeName="transform" type="translate"
      from="1450 0" to="-1000 0" dur="14s" repeatCount="indefinite" calcMode="linear"/>

    <!-- gentle flight bob -->
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 -5;0 2;0 -4;0 3;0 -2;0 0"
      dur="3.5s" repeatCount="indefinite" additive="sum" calcMode="spline"
      keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1"/>

    <!-- cable behind ship, towards billboard -->
    <path d="M470 270 C515 270 545 270 580 270"
          fill="none" stroke="#ffd5f7" stroke-width="3"/>
    <path d="M470 270 C515 270 545 270 580 270"
          fill="none" stroke="#ff28c9" stroke-width="10" opacity=".25" filter="url(#glow)"/>

    <!-- Billboard -->
    <g>
      <rect x="580" y="205" width="300" height="135" rx="5" fill="#090611" stroke="#00f6ff" stroke-width="4" filter="url(#glow)"/>
      <rect x="591" y="216" width="278" height="113" fill="url(#sign)" stroke="#ff27c8" stroke-width="2"/>
      <rect x="598" y="223" width="264" height="99" fill="#06050d"/>

      <!-- pixel frame -->
      <g fill="#ff35cc">
        <rect x="580" y="196" width="12" height="9"/><rect x="868" y="196" width="12" height="9"/>
        <rect x="580" y="340" width="12" height="9"/><rect x="868" y="340" width="12" height="9"/>
      </g>

      <g font-family="monospace" font-weight="700" text-anchor="middle">
        <text x="730" y="249" font-size="27" fill="#00f6ff">| GO |</text>
        <text x="730" y="278" font-size="20" fill="#ff6fe0">| TypeScript |</text>
        <text x="730" y="308" font-size="27" fill="#ffe86b">| Rust |</text>
      </g>

      <!-- scan flicker -->
      <rect x="598" y="223" width="264" height="99" fill="url(#scan)">
        <animate attributeName="opacity" values=".2;.65;.25;.5;.2" dur="1.7s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ship shadow/glow -->
    <ellipse cx="350" cy="270" rx="125" ry="46" fill="#00eaff" opacity=".13" filter="url(#bigGlow)"/>

    <!-- spaceship, nose LEFT -->
    <g shape-rendering="crispEdges">
      <!-- main hull -->
      <path d="M205 263h28v-18h24v-13h80v8h34v10h43v20h-43v10h-34v8h-80v-13h-24v-12z"
            fill="url(#ship)" stroke="#00f6ff" stroke-width="3"/>
      <!-- left nose -->
      <path d="M205 263h-42l-18 10 18 10h42z" fill="#ff38ce" stroke="#00f6ff" stroke-width="2"/>
      <path d="M205 263h28v-10h20" fill="none" stroke="#ff69dd" stroke-width="3"
            stroke-linecap="square" stroke-linejoin="miter"/>
      <!-- continuous pink trim: nose -> hull -> cockpit -->
      <path d="M163 273h42v-10h48v-15h27"
            fill="none" stroke="#ff69dd" stroke-width="4"
            stroke-linecap="square" stroke-linejoin="miter" filter="url(#glow)"/>
      <path d="M163 273h42v-10h48v-15h27"
            fill="none" stroke="#ff69dd" stroke-width="2"
            stroke-linecap="square" stroke-linejoin="miter"/>

      <!-- cockpit -->
      <path d="M280 232h58v9h18v20h-18v9h-58z" fill="#28114d" stroke="#ff69dd" stroke-width="3"/>
      <rect x="292" y="241" width="25" height="9" fill="#66f9ff"/>
      <rect x="327" y="241" width="9" height="9" fill="#ff75df"/>

      <!-- wing fins -->
      <path d="M270 288h48l-13 27h-20z" fill="#7048ff" stroke="#00f6ff" stroke-width="2"/>
      <path d="M270 230h48l-13-27h-20z" fill="#7048ff" stroke="#00f6ff" stroke-width="2"/>

      <!-- RIGHT rear engine -->
      <rect x="414" y="248" width="18" height="24" fill="#3a1c63" stroke="#00f6ff" stroke-width="2"/>
      <rect x="432" y="251" width="18" height="18" fill="#ff7b25"/>

      <!-- animated thruster -->
      <path d="M450 251h45l-20 9 20 9h-45z" fill="#ffb21f">
        <animate attributeName="opacity" values=".35;1;.45;.9;.35" dur=".28s" repeatCount="indefinite"/>
      </path>
      <path d="M450 251h72l-38 9 38 9h-72z" fill="#ff27ce" opacity=".65" filter="url(#glow)">
        <animate attributeName="opacity" values=".15;.8;.2;.9;.15" dur=".42s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- exhaust sparks move RIGHT -->
    <g fill="#ff51d7">
      <rect x="520" y="253" width="7" height="7"><animate attributeName="x" values="520;590;650" dur=".8s" repeatCount="indefinite"/></rect>
      <rect x="505" y="278" width="5" height="5"><animate attributeName="x" values="505;575;635" dur="1.05s" repeatCount="indefinite"/></rect>
      <rect x="530" y="235" width="4" height="4"><animate attributeName="x" values="530;600;675" dur=".95s" repeatCount="indefinite"/></rect>
    </g>

    <!-- tiny orbiting telemetry dots -->
    <g fill="#00f6ff">
      <circle cx="250" cy="195" r="3"><animate attributeName="cy" values="195;215;195" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="320" r="3"><animate attributeName="cy" values="320;300;320" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- HUD / identity -->
  <g font-family="monospace">
    <text x="700" y="462" text-anchor="middle" font-size="31" font-weight="700"
          letter-spacing="9" fill="#fff" filter="url(#glow)">MALLARD</text>
    <text x="700" y="489" text-anchor="middle" font-size="13"
          letter-spacing="3" fill="#00f6ff">GO • TYPESCRIPT • RUST • EMBEDDED • C</text>

    <text x="35" y="40" font-size="11" letter-spacing="2" fill="#00f6ff" opacity=".8">/var/lib/docker/$mallard</text>
    <text x="1365" y="40" text-anchor="end" font-size="11" letter-spacing="2" fill="#ff48d2" opacity=".8">ONLINE_0xC0DE</text>
  </g>

  <!-- CRT glass -->
  <rect width="1400" height="560" fill="url(#scan)" pointer-events="none"/>
  <rect x="8" y="8" width="1384" height="544" rx="10" fill="none" stroke="#ff35ca" stroke-width="2" opacity=".55"/>
  <rect x="14" y="14" width="1372" height="532" rx="8" fill="none" stroke="#00eaff" stroke-width="1" opacity=".25"/>
</svg>
